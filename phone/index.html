<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7">
<title>my-kart 手柄</title>
<style>
  /* ==========================================================================
     视觉与布局照参考项目 chinese-can-fly-kart/phone（作者的 controller.css + 设计参考图）。
     上一版我只学了它的"三栏 + 圆形键"，没学**配色与质感**，结果还是被说丑。
     这一版把它的视觉语言整条搬过来：
       · 浅灰底 #f3f5f7 + 浅灰圆键 #e0e6ed + 细边 #d6dee7（户外强光下也看得清）
       · 深色只留给"主操作"（油门 / 开启体感），一眼分出主次
       · 键按下 scale(.95) + 变深（手指能感到"按下去了"）
       · 中间栏只放大号角度 + 刻度尺 + 一行状态 + 按键，其余全收进设置弹层
       · 矮屏（≤340px）单独收一档 —— 手机横屏被浏览器地址栏挤过就是这个高度

     用户实测反馈（本轮）：
       · 「左右还是反的」→ **默认改成反向**（他两次实测都是"右倾→左转"，这就是真机证据），
         并且把「⇄ 左右互换」直接放在主界面 —— 不再藏在设置里等他找。
         同时换了 localStorage 的 key（v9），旧的 invert 值自动作废，否则会盖掉新默认。
       · 「ui 设计还是一坨屎」→ 换浅色系 + 质感（见上）。
     ========================================================================== */
  :root {
    --bg: #f3f5f7;
    --card: #e0e6ed;
    --card-line: #d6dee7;
    --ink: #46566b;
    --ink-soft: #738497;
    --muted: #8794a3;
    --deep: #3b4c62;
    --deep-held: #293b51;
    --gauge: #748fa9;
    --warm: #f3ecdf;
    --warm-ink: #8a6b3f;
    --key: min(29dvh, 19vw, 138px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
    /* 长按不唤出浏览器菜单：长按油门是**正常玩法**，不是误操作 */
    -webkit-touch-callout: none;
  }
  body { height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: none; }
  button:focus-visible { outline: 2px solid #718da9; outline-offset: 3px; }

  .shell {
    height: 100%; width: min(1100px, 100%); margin: 0 auto;
    padding: 6px 18px 10px; display: grid; grid-template-rows: 28px minmax(0, 1fr); gap: 4px;
  }

  /* ---------- 状态行：28px，只放连接 + 往返 + 两个入口 ---------- */
  .topbar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  #dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: #b7c0cb; }
  #dot.on { background: #738faa; }
  #state { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #echo { margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; color: #9aa7b5; }
  .mini {
    flex: 0 0 auto; min-height: 26px; padding: 3px 13px; border-radius: 14px;
    background: #e7edf2; color: #6d8093; font-size: 11px; font-weight: 500;
  }
  .mini.on { background: var(--deep); color: #f7fafc; }

  /* ---------- 主区三栏 ---------- */
  .pad { min-height: 0; display: grid; grid-template-columns: 1fr minmax(152px, 27%) 1fr; gap: 10px; align-items: center; }
  .grip { height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 14px; }

  .face {
    flex: 0 0 auto; width: var(--key); height: var(--key); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--card-line); color: var(--ink);
    font-size: clamp(17px, 4.4dvh, 23px); font-weight: 600; letter-spacing: .04em;
    box-shadow: inset 0 -2px 0 rgba(70, 86, 107, .07);
    transition: transform .06s, background .06s;
  }
  .face:active, .face.on { background: #c3cfdc; transform: scale(.95); }
  /* 油门：长按最多的键，用最深一档，和刹车一眼分开 */
  .face.primary { background: var(--deep); border-color: var(--deep); color: #f7fafc; }
  .face.primary:active, .face.primary.on { background: var(--deep-held); }

  .console {
    position: relative; height: 100%; min-height: 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  #angle {
    font-size: clamp(22px, 6dvh, 34px); font-weight: 400; color: #62768b;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  /* 刻度尺：中线是中位，指针左右滑（照参考的 meter）*/
  .meter {
    position: relative; width: 100%; max-width: 170px; height: 16px;
    background: repeating-linear-gradient(to right, #c4ced9 0 1px, transparent 1px 10%);
    border-right: 1px solid #c4ced9; border-radius: 2px;
  }
  .meter::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: #aebdcc; }
  #needle {
    position: absolute; z-index: 1; left: 50%; top: -5px; width: 3px; height: 26px; border-radius: 2px;
    background: var(--gauge); transform: translateX(-50%); transition: left 60ms linear;
  }
  #tilt-state { font-size: 12px; line-height: 1.4; color: var(--ink-soft); text-align: center; max-width: 100%; }
  #tilt-state.ok { color: #3f7a5c; }
  #tilt-state.warn { color: #a4703a; }

  .pill {
    min-height: 36px; padding: 7px 16px; border-radius: 18px;
    background: #e7edf2; color: #5c738a; font-size: 13px; font-weight: 500;
    transition: background .06s, transform .06s;
  }
  .pill:active { background: #d3dde7; transform: scale(.97); }
  .pill.on { background: var(--deep); color: #f7fafc; }
  /* 互换键给暖色：它是"纠错"用的，必须一眼看见 */
  .pill.warm { background: var(--warm); color: var(--warm-ink); }
  .pair { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  /* ---------- 设置弹层 ---------- */
  dialog {
    width: min(420px, calc(100vw - 24px)); max-height: calc(100dvh - 20px); overflow: auto;
    background: var(--bg); color: var(--ink); border: 1px solid var(--card-line);
    border-radius: 20px; padding: 20px; touch-action: pan-y;
  }
  dialog::backdrop { background: #1b253954; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .dlg-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; margin: 16px 0; font-size: 13px; }
  .row > label { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--gauge); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--gauge); }
  output { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 40px; text-align: right; }
  .note { font-size: 11px; color: var(--muted); line-height: 1.65; margin: 4px 0 0; }
  #tilt-raw { font-size: 11px; color: #9aa7b5; font-variant-numeric: tabular-nums; margin: 16px 0 0; }

  /* ---------- 竖屏：只留提示 ---------- */
  #rotate {
    position: fixed; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center; background: var(--bg);
  }
  #rotate .icon { font-size: 54px; color: #8ea2b6; }
  #rotate h1 { margin: 0; font-size: 21px; font-weight: 500; color: #647a90; }
  #rotate p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; max-width: 430px; }
  #rotate b { color: var(--ink); }
  @media (orientation: portrait) { #rotate { display: flex; } }

  /* 矮屏（手机横屏被浏览器 UI 挤过之后的高度）：一切收一档 */
  @media (max-height: 340px) {
    :root { --key: min(26dvh, 17vw, 108px); }
    .shell { grid-template-rows: 24px minmax(0, 1fr); padding: 3px 14px 5px; gap: 2px; }
    .grip { gap: 10px; }
    .console { gap: 8px; }
    #echo { display: none; }
    .pill { min-height: 30px; padding: 5px 13px; font-size: 12px; }
    .meter { height: 14px; }
    #needle { height: 22px; top: -4px; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span id="dot"></span>
      <span id="state">连接中…</span>
      <span id="echo"></span>
      <button class="mini" id="fs-btn">全屏</button>
      <button class="mini" id="set-btn">设置</button>
    </header>

    <main class="pad">
      <section class="grip" aria-label="转向">
        <button class="face" data-hold="left" aria-label="左转">◀</button>
        <button class="face" data-hold="right" aria-label="右转">▶</button>
      </section>

      <section class="console" aria-label="体感">
        <output id="angle">0°</output>
        <div class="meter" aria-hidden="true"><i id="needle"></i></div>
        <p id="tilt-state" role="status">体感：关</p>
        <button class="pill" id="tilt-btn">开启体感</button>
        <div class="pair">
          <button class="pill" id="cal-btn">校准中位</button>
          <button class="pill warm" id="flip-btn">⇄ 左右互换</button>
        </div>
      </section>

      <section class="grip" aria-label="油门与刹车">
        <button class="face" data-hold="brake" aria-label="刹车">刹车</button>
        <button class="face primary" data-hold="accel" aria-label="油门">油门</button>
      </section>
    </main>
  </div>

  <dialog id="settings-dialog">
    <div class="dlg-head">
      <h2>设置</h2>
      <button class="mini" id="set-close">关闭</button>
    </div>

    <div class="row">
      <label>转向幅度
        <input id="range" type="range" min="15" max="50" step="1" value="32">
      </label>
      <output id="range-value">32°</output>
    </div>
    <p class="note">手机要倾斜多少度才打满方向。觉得"轻轻一歪就大幅转向"→ 把它调大（50° 最迟钝）。</p>

    <div class="row">
      <label><input id="invert" type="checkbox"> 反向（和主界面的「⇄ 左右互换」是同一个开关）</label>
    </div>

    <div class="row">
      <button class="pill" id="boost-btn">急转：关</button>
    </div>
    <p class="note">陀螺仪"拧得快 = 急转"的额外加成，默认关（两个参考项目都没用它，见 PROGRESS 第 12 轮）。</p>

    <p id="tilt-raw">β —　γ —　屏 —　拧 —</p>
    <p class="note">传感器原始读数：打开体感后倾斜手机，它们应该跟着变；一直不动 = 传感器没出数据（先查 https 与权限）。</p>
  </dialog>

  <div id="rotate">
    <div class="icon" aria-hidden="true">↻</div>
    <h1>请把手机横过来</h1>
    <p>横屏才合手：左手 <b>◀ ▶</b> 转向，右手 <b>刹车 / 油门</b>。<br>
       点右上角 <b>全屏</b> 可去掉浏览器地址栏、并尝试锁定横屏。</p>
  </div>

<script type="module">
// ============================================================================
//  手机手柄 —— 把「手指按了哪些键」+「手机怎么倾」发回电脑上的 dev-server
//
//  纯逻辑都在可测模块里（手机页本身没有测试）：
//    src/pad-input.js   按钮 → 输入（含按钮/体感的合成规则）
//    src/tilt.js        姿态 → 转向量（atan2 / 平放守卫 / 屏幕方向三个坑）
//
//  ★ 体感必须走 https（DeviceOrientationEvent 只在安全上下文可用）。
//  ★ 发送用 HTTP POST：不需要依赖、调试可见；**必须设超时**，否则"连不上"
//    会挂到系统 TCP 超时（~30 秒），界面显示成"往返 29000ms"，把人误导成延迟高。
// ============================================================================

import { createPadState, pressAction, releaseContact, releaseAll, isHeld, padInput, mergeTurn }
  from '/src/pad-input.js';
import { rollDegrees, angleDifference, steerFromTilt, screenAngle, combineSteer }
  from '/src/tilt.js';

const dot = document.getElementById('dot');
const stateEl = document.getElementById('state');
const echoEl = document.getElementById('echo');
const tiltBtn = document.getElementById('tilt-btn');
const calBtn = document.getElementById('cal-btn');
const flipBtn = document.getElementById('flip-btn');
const fsBtn = document.getElementById('fs-btn');
const setBtn = document.getElementById('set-btn');
const setClose = document.getElementById('set-close');
const settingsDialog = document.getElementById('settings-dialog');
const angleEl = document.getElementById('angle');
const needle = document.getElementById('needle');
const tiltStateEl = document.getElementById('tilt-state');
const tiltRawEl = document.getElementById('tilt-raw');
const rangeEl = document.getElementById('range');
const rangeValueEl = document.getElementById('range-value');
const invertEl = document.getElementById('invert');
const boostBtn = document.getElementById('boost-btn');

const pad = createPadState();
let seq = 0;
let rttMs = null;

// 提示单独记时刻，3 秒内不被心跳覆盖（否则失败原因一闪就被擦掉 =「点了没反应」）
let noticeAt = 0;
function setNotice(text) {
  noticeAt = performance.now();
  stateEl.textContent = text;
}

const sending = !new URLSearchParams(location.search).has('nostream');   // ?nostream=1：截图/排查用

// ---------------------------------------------------------------------------
//  参数（存 localStorage）
//
//  ★ key 从 v7 换成 v9 是**有意的**：老版本可能在 localStorage 里存过
//    `invert: false`，它会盖掉新默认值 —— 换了 key 旧设置就自动作废。
//    换默认值时必须一起换 key，这条别再忘。
// ---------------------------------------------------------------------------
const SETTINGS_KEY = 'my-kart-pad-settings-v9';
const SENSOR_STALE_MS = 600;
const CAL_STABLE_MS = 160;
const BOOST_STEPS = [0, 0.25, 0.5, 0.8];
const BOOST_LABELS = ['关', '小', '中', '大'];

/**
 * 默认值
 *  · range 32°：原来 25° 被实测判为"没大角度就大幅转"，调大才迟钝
 *  · invert **true**：用户两次真机实测都是「手机往右倾 → 轮子往左歪」，
 *    这就是真机证据 —— 默认反过来。万一他的握持方向变了，
 *    主界面的「⇄ 左右互换」一点就回。
 */
const settings = { range: 32, invert: true, boost: 0 };

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    if (Number.isFinite(s.range) && s.range >= 15 && s.range <= 50) settings.range = s.range;
    if (typeof s.invert === 'boolean') settings.invert = s.invert;
    if (Number.isInteger(s.boost) && s.boost >= 0 && s.boost < BOOST_STEPS.length) settings.boost = s.boost;
  } catch { /* 无痕模式：用默认值，别因此崩掉 */ }
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch { /* 存不了就算了 */ }
}
loadSettings();

// ---------------------------------------------------------------------------
//  体感状态
// ---------------------------------------------------------------------------
let tiltOn = false;
let raw = null;
let zero = null;
let sensorAt = 0;
let candidate = null;
let stableAt = 0;
let lastBeta = null;
let lastGamma = null;
let rateDps = 0;
let rateAt = 0;
const RATE_STALE_MS = 300;

function isLandscape() { return matchMedia('(orientation: landscape)').matches; }

function currentScreenAngle() {
  return screenAngle({
    legacy: window.orientation,
    angle: screen?.orientation?.angle,
    type: screen?.orientation?.type,
    landscape: isLandscape(),
  });
}

const fmt = (x) => (x === null || x === undefined || Number.isNaN(x) ? '—' : Math.round(x));

/** 没数据 / 没校准 / 过期 / 非横屏 一律 0（不能让车因为传感器坏了就乱转） */
function tiltTurn() {
  if (!tiltOn || raw === null || zero === null) return 0;
  if (!isLandscape()) return 0;
  if (performance.now() - sensorAt > SENSOR_STALE_MS) return 0;
  const base = steerFromTilt(angleDifference(raw, zero), settings.range, settings.invert);
  const fresh = performance.now() - rateAt <= RATE_STALE_MS;
  const rate = fresh ? rateDps * (settings.invert ? -1 : 1) : 0;
  return combineSteer(base, rate, BOOST_STEPS[settings.boost]);
}

function tiltStatus() {
  if (!tiltOn) {
    return window.isSecureContext
      ? { text: '体感：关（点下面开启）', cls: '' }
      : { text: '体感需要 https（当前是 http，按钮仍可用）', cls: 'warn' };
  }
  if (!isLandscape()) return { text: '体感：请把手机横过来', cls: 'warn' };
  if (raw === null) return { text: '体感：手机接近平放，立起来握', cls: 'warn' };
  if (zero === null) return { text: '体感：校准中…（拿稳别动）', cls: 'warn' };
  if (performance.now() - sensorAt > SENSOR_STALE_MS) return { text: '体感：传感器没数据', cls: 'warn' };
  return { text: '体感：就绪 · 倾斜即转向', cls: 'ok' };
}

function onMotion(e) {
  const r = e.rotationRate;
  if (!r || !Number.isFinite(r.alpha)) return;
  rateDps = r.alpha;
  rateAt = performance.now();
}

function onOrientation(e) {
  if (!Number.isFinite(e.beta) || !Number.isFinite(e.gamma)) return;
  lastBeta = e.beta;
  lastGamma = e.gamma;
  const v = rollDegrees(e.beta, e.gamma, currentScreenAngle());
  if (v === null) { raw = null; zero = null; return; }
  const now = performance.now();
  raw = v;
  sensorAt = now;
  // 中位校准：**姿势稳定 160ms 才取零**（乱动时取的零是错的）
  if (zero === null) {
    if (candidate === null || Math.abs(angleDifference(raw, candidate)) > 3) {
      candidate = raw;
      stableAt = now;
    }
    if (now - stableAt >= CAL_STABLE_MS) { zero = raw; candidate = null; }
  }
}

async function enableTilt() {
  if (!isLandscape()) { setNotice('请先把手机横过来（体感只在横屏下用）'); return; }
  if (!window.isSecureContext) { setNotice('体感需要 https 打开（当前不是安全上下文）'); return; }
  if (typeof DeviceOrientationEvent === 'undefined') { setNotice('这个浏览器不支持体感'); return; }
  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') { setNotice('体感权限被拒绝'); return; }
    }
    if (typeof DeviceMotionEvent !== 'undefined'
        && typeof DeviceMotionEvent.requestPermission === 'function') {
      try { await DeviceMotionEvent.requestPermission(); } catch { /* 不给就算了 */ }
    }
    window.addEventListener('deviceorientation', onOrientation);
    window.addEventListener('devicemotion', onMotion);
    window.addEventListener('orientationchange', resetCalibration);
    screen?.orientation?.addEventListener?.('change', resetCalibration);
    tiltOn = true;
    zero = null; candidate = null;
    syncControls();
    setNotice('体感已开 · 拿稳手机校准中…');
  } catch (e) {
    setNotice('体感开启失败（' + (e.message || e) + '）');
  }
}

function disableTilt() {
  tiltOn = false;
  window.removeEventListener('deviceorientation', onOrientation);
  window.removeEventListener('devicemotion', onMotion);
  syncControls();
}
function resetCalibration() { zero = null; candidate = null; }

tiltBtn.addEventListener('click', () => { tiltOn ? disableTilt() : enableTilt(); });

calBtn.addEventListener('click', () => {
  if (!tiltOn) { enableTilt(); return; }
  if (raw === null || performance.now() - sensorAt > SENSOR_STALE_MS) { setNotice('请先拿稳手机'); return; }
  zero = raw; candidate = null;
  setNotice('已校准：以现在的握姿为中位');
});

/** 主界面的一键互换 —— 用户两次实测说反，所以这个必须随手可点，不该藏在设置里 */
flipBtn.addEventListener('click', () => {
  settings.invert = !settings.invert;
  saveSettings();
  syncControls();
  setNotice(settings.invert
    ? '已互换：现在往右倾 = 往右转'
    : '已互换：现在往右倾 = 往左转');
});

invertEl.addEventListener('change', () => {
  settings.invert = invertEl.checked;
  saveSettings();
  syncControls();
});

rangeEl.addEventListener('input', () => {
  settings.range = Number(rangeEl.value);
  rangeValueEl.textContent = settings.range + '°';
  saveSettings();
});

boostBtn.addEventListener('click', () => {
  settings.boost = (settings.boost + 1) % BOOST_STEPS.length;
  saveSettings();
  syncControls();
});

function syncControls() {
  tiltBtn.textContent = tiltOn ? '关闭体感' : '开启体感';
  tiltBtn.classList.toggle('on', tiltOn);
  invertEl.checked = settings.invert;
  flipBtn.classList.toggle('on', !settings.invert);   // 反过来时给个视觉标记
  boostBtn.textContent = '急转：' + BOOST_LABELS[settings.boost];
  boostBtn.classList.toggle('on', settings.boost > 0);
  rangeEl.value = String(settings.range);
  rangeValueEl.textContent = settings.range + '°';
}
syncControls();

setBtn.addEventListener('click', () => settingsDialog.showModal());
setClose.addEventListener('click', () => settingsDialog.close());

// 全屏：去掉浏览器地址栏（横屏高度就回来了），并尝试锁定横屏
fsBtn.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen?.({ navigationUI: 'hide' });
      try { await screen.orientation?.lock?.('landscape'); } catch { /* 不支持就算了 */ }
    } else {
      await document.exitFullscreen?.();
    }
  } catch (e) {
    setNotice('全屏失败：' + (e.message || e));
  }
});
document.addEventListener('fullscreenchange', () => {
  fsBtn.textContent = document.fullscreenElement ? '退出' : '全屏';
  fsBtn.classList.toggle('on', !!document.fullscreenElement);
});

// ---------------------------------------------------------------------------
//  每帧：仪表 / 状态 / 原始读数（纯 DOM，不走网络）
// ---------------------------------------------------------------------------
let lastStateKey = '';
let lastRawKey = '';

function updateUi() {
  const t = tiltTurn();
  needle.style.left = (50 + t * 46) + '%';
  const deg = (raw !== null && zero !== null) ? angleDifference(raw, zero) : null;
  angleEl.textContent = (deg === null ? '—' : Math.round(deg)) + '°';

  const st = tiltStatus();
  const key = st.text + st.cls;
  if (key !== lastStateKey) {
    lastStateKey = key;
    tiltStateEl.textContent = st.text;
    tiltStateEl.className = st.cls;
  }

  const rawKey = `${fmt(lastBeta)}|${fmt(lastGamma)}|${currentScreenAngle()}|${fmt(rateDps)}`;
  if (rawKey !== lastRawKey) {
    lastRawKey = rawKey;
    tiltRawEl.textContent = `β ${fmt(lastBeta)}　γ ${fmt(lastGamma)}　屏 ${currentScreenAngle()}°　拧 ${fmt(rateDps)}`;
  }
  requestAnimationFrame(updateUi);
}
requestAnimationFrame(updateUi);

// ---------------------------------------------------------------------------
//  发送
// ---------------------------------------------------------------------------
async function send() {
  if (!sending) return;
  const p = padInput(pad);
  const input = { forward: p.forward, turn: mergeTurn(p.turn, tiltTurn()) };
  const t0 = performance.now();
  try {
    const res = await fetch('/api/input', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...input, seq: seq++ }),
      signal: AbortSignal.timeout(1500),   // 必须设：见文件头注释
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const ms = performance.now() - t0;
    rttMs = rttMs === null ? ms : rttMs * 0.8 + ms * 0.2;
    dot.classList.add('on');
    if (performance.now() - noticeAt > 3000) {
      stateEl.textContent = `已连接 · v9 · 往返 ${Math.round(rttMs)} ms`;
    }
  } catch (e) {
    dot.classList.remove('on');
    rttMs = null;
    const why = e && e.name === 'TimeoutError' ? '超时（1.5 秒没响应）' : (e.message || e);
    stateEl.textContent = '连不上电脑（' + why + '）';
  }
  echoEl.textContent = `油门 ${input.forward}　转向 ${input.turn.toFixed(2)}`;
}

// 长按不能唤出浏览器菜单：油门是"按住不放"的键，长按是正常用法
// （CSS 的 -webkit-touch-callout 管 iOS，这条 contextmenu 管安卓与桌面）
document.addEventListener('contextmenu', (e) => e.preventDefault());

// 按下 / 松开：Pointer Events，天然多点触控
// ★ 松手听三个事件：pointerup / pointercancel / **lostpointercapture**（少了第三个，
//   捕获被系统收走时按钮会一直停在"按着"，车一直冲）；不听 pointerleave。
for (const el of document.querySelectorAll('[data-hold]')) {
  const action = el.dataset.hold;

  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    el.setPointerCapture?.(e.pointerId);
    pressAction(pad, e.pointerId, action);
    el.classList.add('on');
    send();
  });

  const release = (e) => {
    releaseContact(pad, e.pointerId);
    if (!isHeld(pad, action)) el.classList.remove('on');   // 还有别的手指按着就保持高亮
    send();
  };
  for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    el.addEventListener(name, release);
  }
}

function releaseEverything() {
  releaseAll(pad);
  document.querySelectorAll('.face.on').forEach((b) => b.classList.remove('on'));
  send();
}

setInterval(send, 60);
send();

// 屏幕常亮：不然玩到一半手机息屏，操控直接断（锁在切后台时会被系统释放）
let wakeLock = null;
async function requestWakeLock() {
  try {
    if (document.hidden) return;
    wakeLock = await navigator.wakeLock?.request('screen');
  } catch { /* 不支持就算了 */ }
}
requestWakeLock();

document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseEverything();
  else requestWakeLock();
});
</script>
</body>
</html>
